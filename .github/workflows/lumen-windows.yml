# Does Lumen compile on Windows?
#
# That is the whole question this answers. It is NOT a release pipeline, and it
# deliberately does not become one.
#
# WHY NOT UPSTREAM'S build_viewer.yml. Firestorm's own workflow builds Windows
# on every push, and reusing it looks like the obvious move. It cannot work
# here: it wants **34 secrets** -- Azure code signing, BugSplat crash
# reporting, Discord webhooks, rclone uploads -- and it configures with
# `-DUSE_FMODSTUDIO=ON -DUSE_KDU=ON`. FMOD Studio and Kakadu are licensed
# libraries Firestorm has agreements for and Lumen does not. That is the whole
# reason this project builds `ReleaseOS`, the open-source configuration.
#
# So: no secrets, no signing, no packaging, no upload. None of the 34 is needed
# to find out whether the code compiles.
#
# MANUAL ONLY, ON PURPOSE. the repository is private, so Actions minutes are
# metered, and Windows bills at **twice** the rate of Linux. A viewer build is
# long. Running this per-push would spend the monthly allowance in a few days
# for an answer that changes rarely, so it is `workflow_dispatch` and stays
# that way.
#
# EXPECTED TO FAIL THE FIRST TIME, which is the point -- a list of real
# compiler errors beats a list of guesses. The one known in advance:
# `newview/CMakeLists.txt` links SQLite as
# `$<$<NOT:$<BOOL:${WINDOWS}>>:sqlite3>`, i.e. nothing at all on Windows, so
# `fsainotecache.cpp` will not find `sqlite3.h`. Windows needs the amalgamation
# (one sqlite3.c) or an autobuild package. Fix locally, run again.

name: Lumen - does it build on Windows

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-2022
    # A viewer is a long build and a hung one should not eat the allowance.
    timeout-minutes: 180

    steps:
      - name: Check out Lumen
        uses: actions/checkout@v6
        with:
          path: lumen

      # Upstream's, unmodified -- the same repository bootstrap-mac.sh clones.
      - name: Check out the build variables
        uses: actions/checkout@v6
        with:
          repository: FirestormViewer/fs-build-variables
          path: build-variables

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: autobuild
        working-directory: lumen
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
        shell: cmd

      # cmd.exe, not PowerShell: upstream's own doc/building_windows.md warns
      # that PowerShell does not detect the Visual Studio build tools properly.
      - name: Configure
        working-directory: lumen
        env:
          AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
        run: autobuild configure -c ReleaseOS -A 64 -- -DVIEWER_CHANNEL:STRING=Lumen -DPACKAGE:BOOL=ON
        shell: cmd

      - name: Build
        working-directory: lumen
        env:
          AUTOBUILD_VARIABLES_FILE: ${{ github.workspace }}/build-variables/variables
        run: autobuild build -c ReleaseOS --no-configure
        shell: cmd

      # **And keep the viewer itself, not only the errors.**
      #
      # This job was written to answer "does it build", and it answered that by
      # succeeding or failing. The author then asked the next question -- *"kan
      # jeg se windows udgaven?"* -- and there was nothing to give him: a green
      # run produced logs and no viewer.
      #
      # It also unblocks the one measurement that would reopen Windows code
      # signing. That decision rests on SmartScreen being one click where macOS
      # buries its bypass, which is knowledge rather than something anybody has
      # watched. Downloading this artifact INSIDE a Windows VM sets Mark of the
      # Web exactly as a real download would, and then the dialog says what it
      # says.
      #
      # There is no installer (`PACKAGE:BOOL=OFF`), but there IS an assembled
      # viewer: `copy_w_viewer_manifest` is an ALL target the binary depends
      # on, so viewer_manifest runs on every Windows build whether or not
      # anything is packaged. It writes the shipped tree beside the build
      # output and renames firestorm-bin.exe to Lumen.exe on the way.
      #
      # So the artifact was never missing the viewer -- it was the viewer
      # buried in the build. This drops what nobody receiving it can use:
      # ~700MB of .pdb and .map, the import libraries, the intermediate
      # batch files, and firestorm-bin.exe itself, which is the unrenamed
      # original of the executable beside it. The exclusions mirror
      # viewer_manifest.py's own `exclude_pattern`, so the two agree about
      # what is build detritus.
      #
      # Unzip it and run Lumen.exe in place.
      - name: Keep the viewer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: |
            lumen/build-vc*/newview/Release/
            !lumen/build-vc*/newview/Release/**/*.pdb
            !lumen/build-vc*/newview/Release/**/*.map
            !lumen/build-vc*/newview/Release/**/*.lib
            !lumen/build-vc*/newview/Release/**/*.exp
            !lumen/build-vc*/newview/Release/**/*.bat
            !lumen/build-vc*/newview/Release/**/*.nsi
            !lumen/build-vc*/newview/Release/firestorm-bin.*
            # The installer has its own artifact below; not a second copy in here.
            !lumen/build-vc*/newview/Release/**/Lumen-*-Windows-x64.exe
            # The debug symbols. They are built beside the viewer rather than
            # inside it, so they never reach the installer -- but they DO ride
            # along in this artifact, and somebody who unpacks it finds a
            # 100MB archive sitting next to the thing they wanted. Their own
            # artifact below.
            !lumen/build-vc*/newview/Release/*_pdbsymbols-*.tar.xz
            !lumen/build-vc*/newview/Release/*_symbols-*.tar.bz2

      # The installer, which is the thing to actually hand somebody. NSIS is
      # preinstalled on the runner and viewer_manifest finds makensis itself,
      # so this needs no tool of its own -- only PACKAGE:BOOL=ON above, which
      # was off because the step had never been tried rather than because it
      # was known to fail. Unsigned, so SmartScreen warns on first run: that
      # is the decided position, not an oversight.
      - name: Keep the installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-installer
          # NOT warn. The installer WAS built on 2026-09-21 -- the log says
          # "Created base package Lumen-7-2-4-262642033_Setup.exe" -- and this
          # step looked one directory too high, found nothing, and let the run
          # report success anyway. NSIS writes the file beside its own .nsi, in
          # the staging directory viewer_manifest builds INSIDE newview/Release.
          # Three green runs and no installer to show for them.
          if-no-files-found: error
          retention-days: 7
          # Named for the release since 2026-09-23 -- Lumen-<version>-Windows-x64.exe,
          # the name it is uploaded under, so nobody renames it by hand.
          path: lumen/build-vc*/newview/Release/**/Lumen-*-Windows-x64.exe

      # Kept, because a crash report from a tester is unreadable without them
      # -- just not in the same download as the viewer.
      - name: Keep the debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumen-windows-symbols
          if-no-files-found: ignore
          retention-days: 7
          path: |
            lumen/build-vc*/newview/Release/*_pdbsymbols-*.tar.xz
            lumen/build-vc*/newview/Release/*_symbols-*.tar.bz2

      # What the build actually produced, so a run says plainly whether there
      # is something to hand over rather than leaving it to be inferred from
      # a zip's size.
      - name: Say what came out
        if: success()
        shell: bash
        run: |
          cd lumen/build-vc*/newview/Release
          echo "### Windows build" >> "$GITHUB_STEP_SUMMARY"
          for exe in *.exe ../*_Setup.exe $(find . -name '*_Setup.exe'); do
            [ -e "$exe" ] || continue
            printf -- "- %s  (%s)\n" "$exe" "$(du -h "$exe" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact, without debug symbols: $(du -sh --exclude='*.pdb' --exclude='*.map' \
            --exclude='*.lib' --exclude='*.exp' . | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      # The errors are the product of this workflow, so keep them even when --
      # especially when -- the build fails.
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            lumen/build-vc*/**/*.log
            lumen/build-vc*/CMakeFiles/CMakeError.log
            lumen/build-vc*/CMakeFiles/CMakeOutput.log

# Re-saved so GitHub registers this workflow: it arrived in the repository's
# first push, which Actions did not index.
